<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-green-200 via-white to-red-200 text-gray-800 font-sans p-4 md:p-8 min-h-screen">

    <div class="max-w-md mx-auto bg-white/95 backdrop-blur-sm rounded-xl shadow-xl overflow-hidden p-6 md:max-w-3xl">
        
        <div class="text-center mb-6">
            <img src="logo.ico" alt="Logo" class="h-16 mx-auto mb-3 object-contain">
            <h1 class="text-3xl font-bold text-gray-800">Seguimiento de los gastos del Pichichi</h1>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6 text-center">
            <div class="bg-green-100 p-4 rounded-lg shadow-sm border border-green-200">
                <p class="text-sm text-green-700 font-semibold">Ingresos</p>
                <p id="totalIncome" class="text-xl font-bold text-green-800">$0.00</p>
            </div>
            <div class="bg-red-100 p-4 rounded-lg shadow-sm border border-red-200">
                <p class="text-sm text-red-700 font-semibold">Gastos</p>
                <p id="totalExpense" class="text-xl font-bold text-red-800">$0.00</p>
            </div>
            <div class="col-span-2 bg-blue-50 p-4 rounded-lg border border-blue-200 shadow-sm">
                <p class="text-sm text-blue-700 font-semibold">Presupuesto Máximo (Target de Gastos): <span id="targetAmount">$1000.00</span></p>
                <div class="w-full bg-gray-200 rounded-full h-4 mt-2">
                    <div id="targetBar" class="bg-blue-600 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p id="targetStatus" class="text-xs text-gray-500 mt-2">0% del presupuesto consumido</p>
            </div>
        </div>

        <hr class="my-6 border-gray-300">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div>
                <h2 class="text-xl font-bold mb-4 text-gray-700">Nueva Transacción</h2>
                <form id="financeForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tipo</label>
                            <select id="type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="gasto">Gasto</option>
                                <option value="ingreso">Ingreso</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Categoría</label>
                            <select id="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="Comida">Comida</option>
                                <option value="Transporte">Transporte</option>
                                <option value="Servicios">Servicios</option>
                                <option value="Ocio">Ocio</option>
                                <option value="Salario">Salario (Ingreso)</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Monto ($)</label>
                        <input type="number" id="amount" required min="0.01" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ej: 50.00">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Descripción (Opcional)</label>
                        <input type="text" id="description" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ej: Almuerzo de trabajo">
                    </div>

                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                        Agregar Transacción
                    </button>
                </form>

                <h3 class="text-lg font-bold mt-6 mb-2 text-gray-700">Últimos Movimientos</h3>
                <div class="max-h-48 overflow-y-auto">
                    <ul id="transactionList" class="divide-y divide-gray-200">
                        </ul>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-gray-700">Mis Ahorros</h2>
                <form id="savingsForm" class="space-y-4 mb-4">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Moneda</label>
                            <select id="savingCurrency" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500 focus:border-green-500 text-sm">
                                <option value="ARS">Pesos (ARS)</option>
                                <option value="USD">Dólares (USD)</option>
                                <option value="EUR">Euros (EUR)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Lugar/Tipo</label>
                            <select id="savingType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500 focus:border-green-500 text-sm">
                                <option value="Efectivo">Efectivo</option>
                                <option value="Home Banking">Home Banking</option>
                                <option value="Billetera Virtual">Billetera Virtual</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="savingAmount" required min="0.01" step="0.01" class="block w-2/3 rounded-md border-gray-300 shadow-sm p-2 border focus:ring-green-500 focus:border-green-500" placeholder="Monto">
                        <button type="submit" class="w-1/3 flex justify-center py-2 px-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700">
                            Guardar
                        </button>
                    </div>
                </form>
                
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 max-h-32 overflow-y-auto mb-6">
                    <ul id="savingsList" class="divide-y divide-gray-200 text-sm">
                        </ul>
                </div>

                <h2 class="text-xl font-bold mb-4 text-gray-700 text-center">Gastos por Categoría</h2>
                <div class="relative h-48 w-full flex justify-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <hr class="my-6 border-gray-300">

        <button onclick="exportToCSV()" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-md font-bold text-gray-800 bg-yellow-400 hover:bg-yellow-500 focus:outline-none transition-colors">
            📥 Exportar datos a Excel (.csv)
        </button>

    </div>

    <script>
        const targetGasto = 1000.00; 
        let transactions = JSON.parse(localStorage.getItem('finances')) || [];
        let savings = JSON.parse(localStorage.getItem('savingsData')) || [];
        let myChart = null; // Variable para guardar el gráfico

        const form = document.getElementById('financeForm');
        const savingsForm = document.getElementById('savingsForm');
        
        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');
        const transactionList = document.getElementById('transactionList');
        const savingsList = document.getElementById('savingsList');
        
        const targetBar = document.getElementById('targetBar');
        const targetStatus = document.getElementById('targetStatus');

        function updateDashboard() {
            let income = 0;
            let expense = 0;
            let expenseCategories = {}; // Para el gráfico

            transactionList.innerHTML = ''; 

            transactions.forEach((t, index) => {
                if (t.type === 'ingreso') {
                    income += t.amount;
                } else {
                    expense += t.amount;
                    // Sumar gastos por categoría
                    if(expenseCategories[t.category]) {
                        expenseCategories[t.category] += t.amount;
                    } else {
                        expenseCategories[t.category] = t.amount;
                    }
                }

                const li = document.createElement('li');
                li.className = "py-2 flex justify-between items-center";
                li.innerHTML = `
                    <div>
                        <p class="text-sm font-medium text-gray-900">${t.category}</p>
                        <p class="text-xs text-gray-500 truncate w-32">${t.description || 'Sin desc.'}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-sm ${t.type === 'ingreso' ? 'text-green-600' : 'text-red-600'}">
                            ${t.type === 'ingreso' ? '+' : '-'}$${t.amount.toFixed(2)}
                        </span>
                        <button onclick="deleteTransaction(${index})" class="text-red-500 hover:text-red-700 text-lg font-bold">&times;</button>
                    </div>
                `;
                transactionList.appendChild(li);
            });

            totalIncomeEl.innerText = `$${income.toFixed(2)}`;
            totalExpenseEl.innerText = `$${expense.toFixed(2)}`;

            // Barra de progreso
            let percentage = (expense / targetGasto) * 100;
            if (percentage > 100) percentage = 100;
            
            targetBar.style.width = `${percentage}%`;
            targetStatus.innerText = `${percentage.toFixed(1)}% del presupuesto consumido`;

            if (expense > targetGasto) {
                targetBar.classList.replace('bg-blue-600', 'bg-red-600');
            } else {
                targetBar.classList.replace('bg-red-600', 'bg-blue-600');
            }

            updateChart(expenseCategories);
        }

        // Función para renderizar ahorros
        function updateSavings() {
            savingsList.innerHTML = '';
            savings.forEach((s, index) => {
                const li = document.createElement('li');
                li.className = "py-2 flex justify-between items-center";
                
                // Formato de símbolo según moneda
                let symbol = s.currency === 'EUR' ? '€' : (s.currency === 'USD' ? 'U$D' : '$');

                li.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-gray-800">${s.type}</p>
                        <p class="text-xs text-gray-500">${s.currency}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-blue-700">${symbol} ${s.amount.toFixed(2)}</span>
                        <button onclick="deleteSaving(${index})" class="text-red-400 hover:text-red-600 text-lg font-bold">&times;</button>
                    </div>
                `;
                savingsList.appendChild(li);
            });
        }

        // Función para actualizar el Gráfico (Chart.js)
        function updateChart(categoriesData) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categoriesData);
            const data = Object.values(categoriesData);

            if (myChart) {
                myChart.destroy(); // Destruimos el anterior antes de redibujar
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#F87171', // Rojo
                            '#60A5FA', // Azul
                            '#FBBF24', // Amarillo
                            '#34D399', // Verde
                            '#A78BFA', // Violeta
                            '#F472B6'  // Rosa
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { boxWidth: 12, font: {size: 10} }
                        }
                    }
                }
            });
        }

        // Eventos de Formularios
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const newTransaction = {
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value,
                date: new Date().toLocaleDateString() 
            };
            transactions.push(newTransaction);
            localStorage.setItem('finances', JSON.stringify(transactions)); 
            form.reset(); 
            updateDashboard(); 
        });

        savingsForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newSaving = {
                currency: document.getElementById('savingCurrency').value,
                type: document.getElementById('savingType').value,
                amount: parseFloat(document.getElementById('savingAmount').value),
            };
            savings.push(newSaving);
            localStorage.setItem('savingsData', JSON.stringify(savings));
            savingsForm.reset();
            updateSavings();
        });

        // Funciones de borrado
        function deleteTransaction(index) {
            transactions.splice(index, 1);
            localStorage.setItem('finances', JSON.stringify(transactions));
            updateDashboard();
        }

        function deleteSaving(index) {
            savings.splice(index, 1);
            localStorage.setItem('savingsData', JSON.stringify(savings));
            updateSavings();
        }

        // Exportar a CSV (Mantiene transacciones, se puede ampliar a ahorros si se desea)
        function exportToCSV() {
            if (transactions.length === 0) {
                alert("No hay transacciones para exportar.");
                return;
            }
            const headers = ['Fecha', 'Tipo', 'Categoría', 'Monto', 'Descripción'];
            const csvRows = [headers.join(',')];
            transactions.forEach(t => {
                const desc = t.description ? `"${t.description.replace(/"/g, '""')}"` : '""';
                const date = t.date ? t.date : "N/A";
                csvRows.push(`${date},${t.type},${t.category},${t.amount},${desc}`);
            });
            const csvString = csvRows.join('\n');
            const blob = new Blob(["\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "mis_finanzas.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Inicializar vistas
        updateDashboard();
        updateSavings();
    </script>
</body>
</html>
